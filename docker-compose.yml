services:
  csfd-ratings:
    build: .
    container_name: csfd-ratings
    restart: unless-stopped
    ports:
      - "7020:7020"
    volumes:
      - ./data:/data
    environment:
      - PORT=7020
      - DB_PATH=/data/csfd-ratings.db
      - WIKIDATA_INCREMENTAL_DAYS=7
      - WIKIDATA_FULL_REFRESH_DAYS=30
      - RATING_TTL_OLD_DAYS=90
      - RATING_TTL_NEW_DAYS=7
      - MISS_TTL_DAYS=7
      - CSFD_CONCURRENCY=2
      - CSFD_DELAY_MS=500
      # Token pro ruční spuštění obnovy Wikidat (POST /admin/refresh-wikidata). Prázdný = vypnuto.
      - ADMIN_TOKEN=
