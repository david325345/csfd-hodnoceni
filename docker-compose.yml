services:
  csfd-ratings:
    build: .
    container_name: csfd-ratings
    restart: unless-stopped
    ports:
      - "7020:7020"
    volumes:
      - ./data:/data
    environment:
      - PORT=7020
      - DB_PATH=/data/csfd-ratings.db
      - WIKIDATA_INCREMENTAL_DAYS=7
      - WIKIDATA_FULL_REFRESH_DAYS=30
      - RATING_TTL_FILM_OLD_DAYS=365
      - RATING_TTL_FILM_LAST_YEAR_DAYS=90
      - RATING_TTL_FILM_NEW_DAYS=3
      - RATING_TTL_SERIES_ENDED_DAYS=365
      - RATING_TTL_SERIES_ONGOING_DAYS=3
      - SERIES_STATUS_CHECK_DAYS=30
      - MISS_TTL_DAYS=7
      - CSFD_CONCURRENCY=2
      - CSFD_DELAY_MS=500
      # Veřejná adresa služby (pro odkaz na ikonu v manifestu). Prázdné = z hlaviček proxy.
      - PUBLIC_URL=
      # Token pro ruční spuštění obnovy Wikidat (POST /admin/refresh-wikidata). Prázdný = vypnuto.
      - ADMIN_TOKEN=
